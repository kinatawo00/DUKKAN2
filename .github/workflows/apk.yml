name: APK

on:
  push:
    branches: [ccr-27244214-zihtjn, main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Publish to the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk farsca-kartlar.apk
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest farsca-kartlar.apk \
            --title "Farsça Kartlar (build ${GITHUB_RUN_NUMBER})" \
            --notes "Telefona indirip kurun. Yeni sürüm eskisinin üzerine kurulur, ilerlemeniz silinmez." \
            --target "$GITHUB_SHA"
